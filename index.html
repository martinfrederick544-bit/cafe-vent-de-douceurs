<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vent Douceurs" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Café Vent de douceurs express</title>
  <style>
    /* ===== VARIABLES ===== */
    :root {
      --panel: rgba(17,26,51,.65);
      --panel2: rgba(10,16,40,.80);
      --text: #e8ecff;
      --muted: #a9b2d6;
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.18);
      --shadow: 0 8px 32px rgba(0,0,0,.45);
      --radius: 16px;
      --radius-sm: 10px;
      --accent: #a78bfa;
      --accent2: #7c3aed;
      --good: #34d399;
      --bad: #fb7185;
      --warn: #fbbf24;
      --bgBase: #0b1020;
    }
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bgBase);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    input, select, textarea { font-family: inherit; }
    a { color: var(--accent); text-decoration: none; }
    /* ===== VANTA BACKGROUND ===== */
    #vanta-bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #0b1020 0%, #130d2e 50%, #0b1020 100%);
    }
    /* CSS fallback animated background */
    #vanta-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(167,139,250,.10) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { opacity: .6; }
      to { opacity: 1; }
    }
    /* ===== LAYOUT ===== */
    #root {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,16,32,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--stroke2);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .topbar-logo {
      width: 40px; height: 40px; border-radius: 8px;
      object-fit: contain; background: #fff;
      padding: 2px; flex-shrink: 0;
    }
    .topbar-titles { flex: 1; min-width: 0; }
    .topbar-name { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { font-size: .72rem; color: var(--muted); }
    .topbar-action { flex-shrink: 0; }
    .content {
      flex: 1;
      padding: 16px;
      padding-bottom: calc(72px + env(safe-area-inset-bottom));
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .content.wide { max-width: 1200px; }
    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(11,16,32,.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--stroke2);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bnav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 10px 4px 8px;
      background: none; color: var(--muted);
      font-size: .65rem; font-weight: 500;
      transition: color .15s;
      border: none; cursor: pointer;
    }
    .bnav-btn.active { color: var(--accent); }
    .bnav-btn .ico { font-size: 1.4rem; line-height: 1; }
    /* ===== SECONDARY NAV (staff) ===== */
    .sec-nav {
      display: flex; gap: 4px; padding: 0 16px 0;
      background: rgba(11,16,32,.7);
      border-bottom: 1px solid var(--stroke);
    }
    .sec-nav-btn {
      padding: 10px 16px; background: none;
      color: var(--muted); font-size: .85rem; font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .sec-nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* ===== PANEL / CARD ===== */
    .panel {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--stroke2);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 18px;
      border-radius: var(--radius-sm); font-size: .9rem; font-weight: 600;
      transition: all .15s; cursor: pointer; border: none;
    }
    .btn-primary { background: var(--accent); color: #1a0a3d; }
    .btn-primary:hover { background: #b89ffb; }
    .btn-secondary { background: rgba(167,139,250,.15); color: var(--accent); border: 1px solid var(--accent2); }
    .btn-secondary:hover { background: rgba(167,139,250,.25); }
    .btn-good { background: var(--good); color: #022c22; }
    .btn-good:hover { background: #6ee7b7; }
    .btn-bad { background: var(--bad); color: #4c0519; }
    .btn-bad:hover { background: #fda4af; }
    .btn-ghost { background: rgba(255,255,255,.07); color: var(--text); border: 1px solid var(--stroke2); }
    .btn-ghost:hover { background: rgba(255,255,255,.12); }
    .btn-sm { padding: 6px 12px; font-size: .8rem; border-radius: 8px; }
    .btn-xs { padding: 4px 8px; font-size: .75rem; border-radius: 6px; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    /* ===== FORMS ===== */
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .form-input {
      width: 100%; background: rgba(255,255,255,.07);
      border: 1px solid var(--stroke2); border-radius: var(--radius-sm);
      color: var(--text); font-size: .95rem; padding: 10px 14px;
      outline: none; transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--muted); }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    textarea.form-input { resize: vertical; min-height: 70px; }
    .form-hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
    /* ===== TOGGLES ===== */
    .toggle-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .toggle {
      position: relative; width: 42px; height: 24px;
      background: rgba(255,255,255,.15); border-radius: 12px;
      transition: background .2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%; background: #fff;
      transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    .toggle.on::after { transform: translateX(18px); }
    /* ===== STEPPER ===== */
    .stepper { display: flex; align-items: center; gap: 8px; }
    .stepper-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(167,139,250,.2); color: var(--accent);
      border: 1px solid var(--accent2); font-size: 1.1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .stepper-btn:hover { background: rgba(167,139,250,.35); }
    .stepper-val { min-width: 24px; text-align: center; font-weight: 700; }
    /* ===== ORDER FORM ===== */
    .mode-selector { display: flex; gap: 10px; margin-bottom: 16px; }
    .mode-btn {
      flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: .9rem; font-weight: 600;
      border: 2px solid var(--stroke2); background: rgba(255,255,255,.05); color: var(--muted);
      cursor: pointer; text-align: center; transition: all .15s;
    }
    .mode-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(167,139,250,.1); }
    .category-block { margin-bottom: 12px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--stroke2); }
    .category-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: rgba(255,255,255,.06);
      cursor: pointer; user-select: none;
    }
    .category-header:hover { background: rgba(255,255,255,.09); }
    .category-name { flex: 1; font-weight: 700; font-size: .95rem; }
    .category-badge {
      background: var(--accent); color: #1a0a3d;
      border-radius: 999px; padding: 2px 8px; font-size: .72rem; font-weight: 700;
    }
    .category-chevron { color: var(--muted); transition: transform .2s; font-size: .8rem; }
    .category-chevron.open { transform: rotate(180deg); }
    .products-list { padding: 8px; background: rgba(0,0,0,.15); display: flex; flex-direction: column; gap: 6px; }
    .product-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,.04); border: 1px solid var(--stroke);
      cursor: pointer; transition: background .15s;
    }
    .product-row:hover { background: rgba(255,255,255,.07); }
    .product-row.in-cart { border-color: var(--accent); background: rgba(167,139,250,.08); }
    .product-img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
    .product-img-placeholder { width: 44px; height: 44px; border-radius: 8px; background: rgba(255,255,255,.06); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-weight: 600; font-size: .9rem; }
    .product-price { font-size: .8rem; color: var(--muted); }
    .product-unavailable { opacity: .4; }
    .product-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    /* Options in cart */
    .options-panel { padding: 10px 12px 12px; background: rgba(0,0,0,.2); border-top: 1px solid var(--stroke); }
    .option-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .option-label { flex: 1; font-size: .85rem; color: var(--muted); }
    /* ===== CART SUMMARY ===== */
    .cart-summary {
      margin-top: 18px; padding: 16px;
      background: var(--panel2); border: 1px solid var(--stroke2);
      border-radius: var(--radius);
    }
    .cart-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .cart-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--stroke); }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-name { font-size: .88rem; font-weight: 600; }
    .cart-item-opts { font-size: .75rem; color: var(--muted); margin-top: 2px; }
    .cart-item-price { font-size: .88rem; font-weight: 600; color: var(--accent); flex-shrink: 0; margin-left: 10px; }
    .cart-total { display: flex; justify-content: space-between; font-size: 1rem; font-weight: 700; padding-top: 10px; margin-top: 4px; }
    .cart-total-val { color: var(--accent); }
    .coupon-bar {
      margin: 12px 0; padding: 10px 14px;
      background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.3);
      border-radius: var(--radius-sm); display: flex; align-items: center; gap: 10px;
    }
    .coupon-bar.active { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.3); }
    /* ===== LOYALTY ===== */
    .loyalty-card { margin-bottom: 16px; }
    .loyalty-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--stroke); }
    .loyalty-item:last-child { border-bottom: none; }
    .loyalty-bar-wrap { flex: 1; background: rgba(255,255,255,.08); border-radius: 999px; height: 6px; overflow: hidden; }
    .loyalty-bar { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
    /* ===== STAFF DASHBOARD ===== */
    .dashboard-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .orders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 620px) { .orders-grid { grid-template-columns: 1fr; } }
    .orders-col-title {
      font-size: .8rem; font-weight: 700; text-transform: uppercase;
      color: var(--muted); letter-spacing: .05em;
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--stroke2);
    }
    .order-card {
      background: var(--panel); border: 1px solid var(--stroke2);
      border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px;
    }
    .order-card.done { border-color: rgba(52,211,153,.25); }
    .order-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .order-id { font-size: .75rem; color: var(--muted); font-family: monospace; }
    .order-time { font-size: .85rem; font-weight: 700; color: var(--accent); }
    .order-client { font-size: .9rem; font-weight: 700; margin-bottom: 2px; }
    .order-location { font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
    .order-items { font-size: .82rem; line-height: 1.5; margin-bottom: 8px; }
    .order-item-line { padding: 2px 0; }
    .order-item-opts { color: var(--muted); font-size: .77rem; padding-left: 10px; }
    .order-total { font-size: .88rem; font-weight: 700; color: var(--accent); }
    .order-coupon { font-size: .78rem; color: var(--warn); margin-top: 2px; }
    .order-comment { font-size: .8rem; color: var(--muted); font-style: italic; margin-top: 4px; }
    .order-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .order-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; cursor: zoom-in; }
    .order-img-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    /* ===== STATUS BADGE ===== */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
    }
    .badge-new { background: rgba(167,139,250,.2); color: var(--accent); border: 1px solid var(--accent2); }
    .badge-done { background: rgba(52,211,153,.15); color: var(--good); border: 1px solid rgba(52,211,153,.3); }
    /* ===== MENU EDITOR ===== */
    .me-category { margin-bottom: 10px; border: 1px solid var(--stroke2); border-radius: var(--radius-sm); overflow: hidden; }
    .me-cat-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: rgba(255,255,255,.06); cursor: pointer; }
    .me-cat-header:hover { background: rgba(255,255,255,.09); }
    .me-cat-name { flex: 1; font-weight: 700; }
    .me-cat-body { padding: 12px; background: rgba(0,0,0,.15); border-top: 1px solid var(--stroke); }
    .me-product { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); margin-bottom: 6px; }
    .me-product-info { flex: 1; min-width: 0; }
    .me-product-name { font-size: .88rem; font-weight: 600; }
    .me-product-price { font-size: .78rem; color: var(--muted); }
    .me-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .me-option-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--stroke); }
    .me-option-row:last-child { border-bottom: none; }
    .me-add-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: flex-end; }
    /* ===== HOURS EDITOR ===== */
    .hours-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .hours-day { background: var(--panel); border: 1px solid var(--stroke2); border-radius: var(--radius-sm); padding: 14px; }
    .hours-day-name { font-weight: 700; margin-bottom: 10px; text-transform: capitalize; }
    .hours-period { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .hours-period-label { flex: 1; font-size: .85rem; }
    /* ===== MASTER PAGE ===== */
    .master-staff-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--stroke); }
    .master-staff-row:last-child { border-bottom: none; }
    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #151c3a; border: 1px solid var(--stroke2);
      border-radius: var(--radius); padding: 24px; max-width: 440px; width: 100%;
    }
    .modal-img { max-width: 100%; max-height: 80vh; border-radius: var(--radius-sm); object-fit: contain; }
    /* ===== ALERTS ===== */
    .alert { padding: 12px 14px; border-radius: var(--radius-sm); font-size: .88rem; margin-bottom: 12px; }
    .alert-err { background: rgba(251,113,133,.15); border: 1px solid rgba(251,113,133,.3); color: #fecaca; }
    .alert-ok { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.25); color: #a7f3d0; }
    /* ===== MISC ===== */
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
    .empty-state { text-align: center; color: var(--muted); padding: 32px 0; font-size: .9rem; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; }
    .mt-sm { margin-top: 8px; }
    .mt { margin-top: 14px; }
    .mt-lg { margin-top: 22px; }
    .mb-sm { margin-bottom: 8px; }
    .mb { margin-bottom: 14px; }
    .gap-sm { gap: 6px; }
    .text-muted { color: var(--muted); font-size: .85rem; }
    .text-accent { color: var(--accent); }
    .text-good { color: var(--good); }
    .text-bad { color: var(--bad); }
    .text-warn { color: var(--warn); }
    .divider { border: none; border-top: 1px solid var(--stroke); margin: 14px 0; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(167,139,250,.15); border: 1px solid var(--accent2);
      border-radius: 999px; padding: 3px 10px; font-size: .78rem; color: var(--accent);
    }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(167,139,250,.3); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--stroke2); }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .topbar-name { font-size: .88rem; }
      .content { padding: 12px; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
<div id="vanta-bg"></div>
<div id="modal" class="modal-overlay hidden"></div>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
<script>
/*
===== SCHEMA SQL — À exécuter dans Supabase SQL Editor =====

CREATE TABLE vd_users (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  name text NOT NULL,
  name_lc text NOT NULL UNIQUE,
  location text NOT NULL,
  pass_hash text NOT NULL,
  created_at timestamptz DEFAULT now()
);
CREATE TABLE vd_staff (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  name text NOT NULL,
  name_lc text NOT NULL UNIQUE,
  pass_hash text NOT NULL,
  created_at timestamptz DEFAULT now()
);
CREATE TABLE vd_menu_categories (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  name text NOT NULL,
  customizable boolean DEFAULT false,
  sort_order int DEFAULT 0,
  created_at timestamptz DEFAULT now()
);
CREATE TABLE vd_menu_products (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  category_id uuid REFERENCES vd_menu_categories(id) ON DELETE CASCADE,
  name text NOT NULL,
  price_cents int DEFAULT 0,
  image_url text,
  available boolean DEFAULT true,
  has_other_text boolean DEFAULT false,
  sort_order int DEFAULT 0,
  created_at timestamptz DEFAULT now()
);
CREATE TABLE vd_product_options (
  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  category_id uuid REFERENCES vd_menu_categories(id) ON DELETE CASCADE,
  product_id uuid REFERENCES vd_menu_products(id) ON DELETE CASCADE,
  name text NOT NULL,
  option_type text NOT NULL DEFAULT 'stepper',
  max_value int DEFAULT 3,
  sort_order int DEFAULT 0
);
CREATE TABLE vd_orders (
  id text PRIMARY KEY,
  created_at_ms bigint NOT NULL,
  user_id uuid REFERENCES vd_users(id),
  user_name text,
  teacher_name text NOT NULL,
  teacher_default_location text,
  delivery_location text NOT NULL,

function h(tag, attrs={}, ...children) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'className') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k,'');
    else if (v !== false && v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    if (typeof child === 'string' || typeof child === 'number') el.appendChild(document.createTextNode(String(child)));
    else if (child instanceof Node) el.appendChild(child);
  }
  return el;
}

function fmtMoney(c) { return `${(c/100).toFixed(2).replace('.',',')} $`; }
function fmtTime(ms) {
  const d = new Date(typeof ms === 'number' ? ms : Date.parse(ms));
  return d.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
}
function fmtDate(ms) {
  const d = new Date(typeof ms === 'number' ? ms : Date.parse(ms));
  return d.toLocaleDateString('fr-CA',{weekday:'short',day:'numeric',month:'short'});
}

function todayDOW() {
  const d = new Date().getDay();
  return DOW_KEYS[d-1] || null;
}

function currentPeriod() {
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  for (const [key,{start,end}] of Object.entries(PERIOD_TIMES)) {
    if (mins >= start[0]*60+start[1] && mins <= end[0]*60+end[1]) return key;
  }
  return null;
}

function isOpenNow() {
  const dow = todayDOW();
  if (!dow) return false;
  const p = currentPeriod();
  if (!p) return false;
  return (S.hours[dow]||[]).includes(p);
}

async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function loadSession() {

    if (u) S.user = JSON.parse(u);

    const cv = localStorage.getItem('vd_clientview');
    if (cv) S.clientView = cv;
  } catch(e) {}
}

function persistSession() {
  if (S.user) localStorage.setItem('vd_user', JSON.stringify(S.user));
  else localStorage.removeItem('vd_user');
  if (S.staffUser) localStorage.setItem('vd_staff', JSON.stringify(S.staffUser));
  else localStorage.removeItem('vd_staff');
  localStorage.setItem('vd_clientview', S.clientView);
}

// ===== BACKEND — PUSH =====
function urlB64ToUint8(b64) {
  const pad='='.repeat((4-b64.length%4)%4);
  const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function subscribePush(role) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Les notifications push ne sont pas supportées sur cet appareil.'); return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { alert('Permission refusée.'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY)
    });
    S.pushSub = sub;
    const j = sub.toJSON();
    await db.from('vd_push_subscriptions').upsert({
      endpoint: j.endpoint, p256dh: j.keys?.p256dh, auth: j.keys?.auth,
      user_id: S.user?.id || S.staffUser?.id || null,
      user_name: S.user?.name || S.staffUser?.name || null,
      role
    });
    alert('Notifications activées !');
    scheduleRender();
  } catch(e) {
    alert('Erreur: ' + e.message);
  }
}

}

// ===== LOYALTY =====
function computeLoyalty(userOrders) {
  const counts = {}, usedCoupons = {};
  for (const order of userOrders) {
    if (order.status !== 'COMPLÉTÉE') continue;
    for (const item of (order.items||[])) {
      if (!item.category_id) continue;
      counts[item.category_id] = (counts[item.category_id]||0) + (item.qty||1);
    }
    if (order.coupon_used) {
      usedCoupons[order.coupon_used] = (usedCoupons[order.coupon_used]||0) + 1;
    }
  }
  const available = {};
  for (const catId of Object.keys(counts)) {
    const earned = Math.floor(counts[catId]/10);
    const used = usedCoupons[catId]||0;
    if (earned > used) available[catId] = earned - used;
  }
  return { counts, available };
}

// ===== CART HELPERS =====
function getOptionsForProduct(productId, categoryId) {
  const cat = S.categories.find(c=>c.id===categoryId);
  return S.productOptions.filter(o=>
    (cat?.customizable && o.category_id===categoryId && !o.product_id) ||
    o.product_id===productId
  ).sort((a,b)=>a.sort_order-b.sort_order);
}

function cartAdd(product) {
  if (!S.cart[product.id]) {
    const opts = {};
    for (const o of getOptionsForProduct(product.id, product.category_id)) {
      opts[o.id] = o.option_type==='toggle' ? false : 0;
    }
    S.cart[product.id] = {product, qty:1, options:opts, otherText:''};
  } else {
    S.cart[product.id].qty++;
  }
  scheduleRender();
}

function cartRemove(productId) {
  if (!S.cart[productId]) return;
  S.cart[productId].qty--;
  if (S.cart[productId].qty <= 0) delete S.cart[productId];
  scheduleRender();
}

function cartClear() { S.cart = {}; S.coupon = null; scheduleRender(); }

function cartTotal(withCoupon=true) {
  let total = 0;
  for (const e of Object.values(S.cart)) total += e.product.price_cents * e.qty;
  if (withCoupon && S.coupon) {
    const items = Object.values(S.cart).filter(e=>e.product.category_id===S.coupon.catId);
    if (items.length > 0) {
      const minPrice = Math.min(...items.map(e=>e.product.price_cents));
      total = Math.max(0, total - minPrice);
    }
  }
  return total;
}

function cartIsEmpty() { return Object.keys(S.cart).length === 0; }

function formatOptionsDisplay(entry) {
  const parts = [];
  for (const [optId, val] of Object.entries(entry.options||{})) {
    const opt = S.productOptions.find(o=>o.id===optId);
    if (!opt) continue;
    if (opt.option_type==='stepper' && val>0) parts.push(`${opt.name}:${val}`);
    else if (opt.option_type==='toggle' && val) parts.push(opt.name);
  }
  if (entry.otherText) parts.push(`"${entry.otherText}"`);
  return parts.join(' · ');
}

function renderClientRegister() {

    errDiv.innerHTML='';

    if (!locIn.value.trim()) { errDiv.appendChild(h('div',{className:'alert alert-err'},'Local requis.')); return; }

    if (passIn.value !== pass2In.value) { errDiv.appendChild(h('div',{className:'alert alert-err'},'Les mots de passe ne correspondent pas.')); return; }
    try {
      const user = await dbRegisterUser(nameIn.value, locIn.value, passIn.value);

      persistSession();
      S.clientView='order'; navigate('client');

      errDiv.appendChild(h('div',{className:'alert alert-err'},e.message.includes('unique') ? 'Ce nom est déjà utilisé.' : e.message));
    }

  wrap.appendChild(h('h2',{style:{marginBottom:'18px',fontSize:'1.1rem'}},'Créer un compte'));
  wrap.appendChild(h('div',{className:'form-group'},h('label',{className:'form-label'},'Nom'),nameIn));
  wrap.appendChild(h('div',{className:'form-group'},h('label',{className:'form-label'},'Local par défaut'),locIn));
  wrap.appendChild(h('div',{className:'form-group'},h('label',{className:'form-label'},'Mot de passe'),passIn));
  wrap.appendChild(h('div',{className:'form-group'},h('label',{className:'form-label'},'Confirmer'),pass2In));
  wrap.appendChild(errDiv);
  wrap.appendChild(h('button',{className:'btn btn-primary btn-full',onClick:doRegister},'Créer le compte'));
  wrap.appendChild(h('p',{style:{textAlign:'center',marginTop:'14px',fontSize:'.85rem',color:'var(--muted)'}},
    h('a',{href:'#client_login'},'← Retour connexion')
  ));

  return h('div',{},wrap);
}

// ===== RENDER — CLIENT ORDER FORM =====
function renderClientOrderForm() {
  const wrap = h('div',{});

  // Fermeture / avertissement
  const open = isOpenNow();
  const dow = todayDOW();
  if (!dow || !(S.hours[dow]||[]).length) {
    wrap.appendChild(h('div',{className:'alert alert-err',style:{marginBottom:'14px'}},'☕ Le café est fermé aujourd\'hui.'));
  } else if (!open) {
    const period = currentPeriod();
    wrap.appendChild(h('div',{className:'alert',style:{background:'rgba(251,191,36,.12)',border:'1px solid rgba(251,191,36,.3)',color:'#fde68a',marginBottom:'14px'}},
      '⏰ Le café est actuellement fermé. Vous pouvez quand même commander.'
    ));
  }

  // Mode livraison / passage
  const modeDiv = h('div',{className:'mode-selector'},
    h('div',{className:`mode-btn ${S.orderMode==='delivery'?'active':''}`,onClick:()=>{S.orderMode='delivery';scheduleRender();}},
      '🚚 Livraison en classe'),
    h('div',{className:`mode-btn ${S.orderMode==='pickup'?'active':''}`,onClick:()=>{S.orderMode='pickup';scheduleRender();}},
      '🏃 Passage au café'),
  );
  wrap.appendChild(modeDiv);

  // Lieu de livraison
  if (S.orderMode==='delivery') {
    const locIn = h('input',{className:'form-input',type:'text',value:S.deliveryLocation,placeholder:'Ex: Local 201'});
    locIn.addEventListener('input',()=>{ S.deliveryLocation=locIn.value; });
    wrap.appendChild(h('div',{className:'form-group mb'},
      h('label',{className:'form-label'},'Local de livraison'),
      locIn,
    ));
  }

  // Categories + produits
  if (!S.categories.length) {
    wrap.appendChild(h('div',{className:'empty-state'},'Aucun menu disponible pour l\'instant.'));
  }

  const availableCats = S.categories.filter(cat => {
    const prods = S.products.filter(p=>p.category_id===cat.id && p.available);
    return prods.length > 0;
  });

  for (const cat of availableCats) {
    const catOpen = S.openCategories.has(cat.id);
    const catProds = S.products.filter(p=>p.category_id===cat.id && p.available);
    const cartCount = catProds.reduce((n,p)=>n+(S.cart[p.id]?.qty||0),0);

    const catBlock = h('div',{className:'category-block mb'});

    const header = h('div',{className:'category-header',onClick:()=>{
      if(S.openCategories.has(cat.id)) S.openCategories.delete(cat.id);
      else S.openCategories.add(cat.id);
      scheduleRender();
    }},
      h('span',{className:'category-name'},cat.name),
      cartCount>0 ? h('span',{className:'category-badge'},`${cartCount} ×`) : null,
      h('span',{className:`category-chevron ${catOpen?'open':''}`},'▼'),
    );
    catBlock.appendChild(header);

    if (catOpen) {
      const prodList = h('div',{className:'products-list'});
      for (const prod of catProds) {
        const inCart = !!S.cart[prod.id];
        const entry = S.cart[prod.id];
        const prodWrap = h('div',{});

        const prodRow = h('div',{className:`product-row ${inCart?'in-cart':''}`},
          prod.image_url
            ? h('img',{className:'product-img',src:prod.image_url,alt:prod.name,onClick:(e)=>{e.stopPropagation();showImageModal(prod.image_url,prod.name);}})
            : h('div',{className:'product-img-placeholder'},'☕'),
          h('div',{className:'product-info'},
            h('div',{className:'product-name'},prod.name),
            h('div',{className:'product-price'},prod.price_cents>0?fmtMoney(prod.price_cents):'Gratuit'),
          ),
          h('div',{className:'product-controls'},
            inCart ? h('div',{className:'stepper'},
              h('button',{className:'stepper-btn',onClick:(e)=>{e.stopPropagation();cartRemove(prod.id);}},'-'),
              h('span',{className:'stepper-val'},entry.qty),
              h('button',{className:'stepper-btn',onClick:(e)=>{e.stopPropagation();cartAdd(prod);}},'+'),
            ) : h('button',{className:'btn btn-primary btn-sm',onClick:(e)=>{e.stopPropagation();cartAdd(prod);}},'+ Ajouter'),
          ),
        );
        prodWrap.appendChild(prodRow);

        // Options panel (si item dans cart + a des options)
        if (inCart) {
          const opts = getOptionsForProduct(prod.id, prod.category_id);
          if (opts.length > 0 || prod.has_other_text) {
            const optsPanel = h('div',{className:'options-panel'});
            for (const opt of opts) {
              const val = entry.options[opt.id];
              const optRow = h('div',{className:'option-row'},
                h('span',{className:'option-label'},opt.name),
              );
              if (opt.option_type==='stepper') {
                optRow.appendChild(h('div',{className:'stepper'},
                  h('button',{className:'stepper-btn',onClick:()=>{
                    entry.options[opt.id]=Math.max(0,(val||0)-1); scheduleRender();
                  }},'-'),
                  h('span',{className:'stepper-val'},val||0),
                  h('button',{className:'stepper-btn',onClick:()=>{
                    entry.options[opt.id]=Math.min(opt.max_value,(val||0)+1); scheduleRender();
                  }},'+'),
                ));
              } else {
                const tog = h('div',{className:`toggle ${val?'on':''}`,onClick:()=>{
                  entry.options[opt.id]=!val; scheduleRender();
                }});
                optRow.appendChild(tog);
              }
              optsPanel.appendChild(optRow);
            }
            if (prod.has_other_text) {
              const otherIn = h('input',{className:'form-input',type:'text',
                placeholder:'Précision / commentaire sur ce produit...',
                value:entry.otherText||'',
                style:{marginTop:'8px',fontSize:'.85rem'}
              });
              otherIn.addEventListener('input',()=>{ entry.otherText=otherIn.value; });
              optsPanel.appendChild(otherIn);
            }
            prodWrap.appendChild(optsPanel);
          }
        }
        prodList.appendChild(prodWrap);
      }
      catBlock.appendChild(prodList);
    }
    wrap.appendChild(catBlock);
  }

  // Commentaire
  const commentIn = h('textarea',{className:'form-input',placeholder:'Commentaire pour la commande...',style:{marginTop:'8px'}});
  commentIn.value = S.comment;
  commentIn.addEventListener('input',()=>{ S.comment=commentIn.value; });
  wrap.appendChild(h('div',{className:'form-group mt'},
    h('label',{className:'form-label'},'Commentaire (optionnel)'),
    commentIn,
  ));

  // Récap panier + fidélité
  if (!cartIsEmpty()) {
    wrap.appendChild(renderCartSummary());
  }

  // Bouton commander
  const submitBtn = h('button',{
    className:'btn btn-primary btn-full mt',
    disabled: cartIsEmpty(),
    onClick: doSubmitOrder,
  },'☕ Passer la commande');
  wrap.appendChild(submitBtn);

  return wrap;
}

function renderCartSummary() {
  const wrap = h('div',{className:'cart-summary mt'});
  wrap.appendChild(h('div',{className:'cart-title'},'🛒 Récapitulatif'));

  for (const entry of Object.values(S.cart)) {
    const opts = formatOptionsDisplay(entry);
    wrap.appendChild(h('div',{className:'cart-item'},
      h('div',{},
        h('div',{className:'cart-item-name'},`${entry.qty} × ${entry.product.name}`),
        opts ? h('div',{className:'cart-item-opts'},opts) : null,
      ),
      h('div',{className:'cart-item-price'},fmtMoney(entry.product.price_cents*entry.qty)),
    ));
  }

  // Fidélité / coupon
  const userOrders = S.orders.filter(o=>o.user_id===S.user?.id);
  if (userOrders.length > 0) {
    const {available} = computeLoyalty(userOrders);
    const availCatIds = Object.keys(available);
    if (availCatIds.length > 0 && !S.coupon) {
      const couponBar = h('div',{className:'coupon-bar',style:{marginTop:'12px'}},
        h('span',{style:{flex:'1'}},'🎁 Coupon fidélité disponible !'),
      );
      for (const catId of availCatIds) {
        const cat = S.categories.find(c=>c.id===catId);
        if (!cat) continue;
        couponBar.appendChild(h('button',{className:'btn btn-sm btn-good',onClick:()=>{
          S.coupon={catId, catName:cat.name}; scheduleRender();
        }},`Utiliser (${cat.name})`));
      }
      wrap.appendChild(couponBar);
    } else if (S.coupon) {
      wrap.appendChild(h('div',{className:'coupon-bar active',style:{marginTop:'12px'}},
        h('span',{style:{flex:'1',color:'var(--good)'}},`🎁 Coupon appliqué : ${S.coupon.catName}`),
        h('button',{className:'btn btn-xs btn-ghost',onClick:()=>{S.coupon=null;scheduleRender();}},'Retirer'),
      ));
    }
  }

  // Total
  const total = cartTotal();
  wrap.appendChild(h('div',{className:'cart-total'},
    h('span',{},'Total'),
    h('span',{className:'cart-total-val'},fmtMoney(total)),
  ));

  return wrap;
}

async function doSubmitOrder() {
  if (cartIsEmpty()) return;
  if (!S.user) return;

  const open = isOpenNow();
  if (!open) {
    showConfirmModal(
      'Café actuellement fermé',
      'Le café n\'est pas ouvert en ce moment. Voulez-vous quand même passer la commande ?',
      () => _submitOrder(),
      null
    );
  } else {
    await _submitOrder();
  }
}

async function _submitOrder() {
  const items = Object.values(S.cart).map(entry => ({
    product_id: entry.product.id,
    product_name: entry.product.name,
    category_id: entry.product.category_id,
    price_cents: entry.product.price_cents,
    qty: entry.qty,
    options: entry.options,
    options_display: formatOptionsDisplay(entry),
    other_text: entry.otherText || null,
    image_url: entry.product.image_url || null,
  }));

  const total = cartTotal(true);
  const loc = S.orderMode==='delivery'
    ? (S.deliveryLocation.trim() || S.user.location)
    : 'Passage au café';

  try {
    await dbSubmitOrder({
      created_at_ms: Date.now(),
      user_id: S.user.id,
      user_name: S.user.name,
      teacher_name: S.user.name,
      teacher_default_location: S.user.location,
      delivery_location: loc,
      comment: S.comment.trim() || null,
      status: 'NOUVELLE',
      items,
      total_cents: total,
      coupon_used: S.coupon?.catId || null,
    });
    cartClear();
    S.comment = '';
    S.coupon = null;
    S.openCategories = new Set();
    S.clientView = 'history';
    await dbLoadOrders();
    scheduleRender();
    alert('✅ Commande envoyée !');
  } catch(e) {
    alert('Erreur: ' + e.message);
  }
}

async function renderClientHistory() {
  const wrap = h('div',{});
  wrap.appendChild(h('h2',{className:'section-title'},'Mes commandes récentes'));

  const userOrders = await dbGetUserOrders();
  const {counts, available} = computeLoyalty(userOrders);

  // Fidélité
  if (S.categories.length > 0) {
    const loyWrap = h('div',{className:'card loyalty-card'});
    loyWrap.appendChild(h('div',{className:'card-title'},'⭐ Programme de fidélité'));
    let hasAny = false;
    for (const cat of S.categories) {
      const count = counts[cat.id]||0;
      const mod = count % 10;
      if (count===0) continue;
      hasAny = true;
      loyWrap.appendChild(h('div',{className:'loyalty-item'},
        h('span',{style:{fontSize:'.85rem',minWidth:'90px'}},cat.name),
        h('div',{className:'loyalty-bar-wrap'},h('div',{className:'loyalty-bar',style:{width:`${mod*10}%`}})),
        h('span',{style:{fontSize:'.8rem',color:'var(--muted)',minWidth:'40px',textAlign:'right'}},`${mod}/10`),
        available[cat.id] ? h('span',{className:'chip'},`🎁 ×${available[cat.id]}`) : null,
      ));
    }
    if (!hasAny) loyWrap.appendChild(h('p',{className:'text-muted'},'Passez des commandes pour accumuler des points !'));
    wrap.appendChild(loyWrap);
  }

  if (!userOrders.length) {
    wrap.appendChild(h('div',{className:'empty-state'},'Aucune commande récente.'));
    return wrap;
  }

  for (const order of userOrders) {
    const card = h('div',{className:'card'});
    card.appendChild(h('div',{className:'row-between mb-sm'},
      h('span',{style:{fontSize:'.85rem',fontWeight:'700'}},fmtDate(order.created_at_ms)),
      h('span',{className:`badge ${order.status==='COMPLÉTÉE'?'badge-done':'badge-new'}`},order.status),
    ));
    card.appendChild(h('div',{className:'text-muted',style:{marginBottom:'6px'}},
      `📍 ${order.delivery_location}`,
    ));
    const itemsList = h('div',{style:{fontSize:'.85rem',marginBottom:'6px'}});
    for (const item of (order.items||[])) {
      itemsList.appendChild(h('div',{},
        `${item.qty} × ${item.product_name}`,
        item.options_display ? h('span',{style:{color:'var(--muted)',fontSize:'.78rem'}},` (${item.options_display})`) : null,
      ));
    }
    card.appendChild(itemsList);
    card.appendChild(h('div',{style:{fontWeight:'700',color:'var(--accent)'}},fmtMoney(order.total_cents)));
    if (order.coupon_used) {
      const cat = S.categories.find(c=>c.id===order.coupon_used);
      card.appendChild(h('div',{className:'text-warn',style:{fontSize:'.78rem',marginTop:'4px'}},`🎁 Coupon: ${cat?.name||order.coupon_used}`));
    }
    wrap.appendChild(card);
  }
  return wrap;
}

// ===== RENDER — CLIENT FAVORITES =====
function renderClientFavorites() {
  const wrap = h('div',{});
  wrap.appendChild(h('h2',{className:'section-title'},'⭐ Favoris'));
  wrap.appendChild(h('p',{className:'text-muted mb'},'Sauvegardez jusqu\'à 3 commandes favorites pour les répéter rapidement.'));

  // Save current cart
  if (!cartIsEmpty()) {
    wrap.appendChild(h('button',{className:'btn btn-secondary btn-full mb',onClick:()=>{
      const label = prompt('Nom de ce favori (optionnel):') || 'Favori';
      const cartSnap = Object.values(S.cart).map(e=>({
        product_id:e.product.id, product_name:e.product.name,
        category_id:e.product.category_id, price_cents:e.product.price_cents,
        qty:e.qty, options:{...e.options}, otherText:e.otherText,
        image_url:e.product.image_url,
      }));
      if (S.favorites.length >= 3) S.favorites.shift();
      S.favorites.push({label, items:cartSnap, savedAt:new Date().toISOString()});
      saveFavs();
      scheduleRender();
      alert('✅ Favori sauvegardé !');
    }},'💾 Sauvegarder le panier actuel'));
  }

  if (!S.favorites.length) {
    wrap.appendChild(h('div',{className:'empty-state'},'Aucun favori sauvegardé.'));
    return wrap;
  }

  for (let i=0; i<S.favorites.length; i++) {
    const fav = S.favorites[i];
    const card = h('div',{className:'card'});
    card.appendChild(h('div',{className:'row-between mb-sm'},
      h('span',{style:{fontWeight:'700'}},fav.label||`Favori ${i+1}`),
      h('span',{className:'text-muted',style:{fontSize:'.78rem'}},fav.savedAt?new Date(fav.savedAt).toLocaleDateString('fr-CA'):''),
    ));
    for (const item of (fav.items||[])) {
      card.appendChild(h('div',{style:{fontSize:'.85rem'}},`${item.qty} × ${item.product_name}`));
    }
    card.appendChild(h('div',{className:'row mt-sm',style:{gap:'8px'}},
      h('button',{className:'btn btn-primary btn-sm',onClick:()=>{
        // Restore cart from fav
        const newCart = {};
        for (const item of (fav.items||[])) {
          const prod = S.products.find(p=>p.id===item.product_id);
          if (!prod) continue;
          newCart[prod.id] = {product:prod, qty:item.qty, options:{...item.options||{}}, otherText:item.otherText||''};
        }
        S.cart = newCart;
        S.clientView = 'order';
        scheduleRender();
      }},'Charger'),
      h('button',{className:'btn btn-bad btn-sm',onClick:()=>{
        if (!confirm('Supprimer ce favori ?')) return;
        S.favorites.splice(i,1);
        saveFavs();
        scheduleRender();
      }},'Supprimer'),
    ));
    wrap.appendChild(card);
  }
  return wrap;
}

  newCol.appendChild(h('div',{className:'orders-col-title'},`Nouvelles (${newOrders.length})`));
  if (!newOrders.length) newCol.appendChild(h('div',{className:'empty-state'},'Aucune nouvelle commande'));
  for (const order of newOrders) newCol.appendChild(renderOrderCard(order));
  grid.appendChild(newCol);

  const doneCol = h('div',{});
  doneCol.appendChild(h('div',{className:'orders-col-title'},`Complétées (${doneOrders.length})`));
  if (!doneOrders.length) doneCol.appendChild(h('div',{className:'empty-state'},'Aucune commande complétée'));
  for (const order of doneOrders) doneCol.appendChild(renderOrderCard(order));
  grid.appendChild(doneCol);

  wrap.appendChild(grid);

}

function renderOrderCard(order) {
  const isDone = order.status==='COMPLÉTÉE';
  const card = h('div',{className:`order-card ${isDone?'done':''}`});

  card.appendChild(h('div',{className:'order-card-header'},
    h('span',{className:'order-id'},order.id.slice(0,16)),
    h('span',{className:'order-time'},fmtTime(order.created_at_ms)),
  ));
  card.appendChild(h('div',{className:'order-client'},order.teacher_name));
  card.appendChild(h('div',{className:'order-location'},
    `📍 ${order.delivery_location}`+(order.delivery_location==='Passage au café'?'':` (défaut: ${order.teacher_default_location||'—'})`),
  ));

  // Images
  const imgs = (order.items||[]).filter(i=>i.image_url);
  if (imgs.length) {
    const imgRow = h('div',{className:'order-img-row'});
    for (const item of imgs) {
      imgRow.appendChild(h('img',{className:'order-thumb',src:item.image_url,alt:item.product_name,
        onClick:()=>showImageModal(item.image_url,item.product_name)}));
    }
    card.appendChild(imgRow);
  }

  // Items
  const itemsDiv = h('div',{className:'order-items'});
  for (const item of (order.items||[])) {
    itemsDiv.appendChild(h('div',{className:'order-item-line'},`${item.qty} × ${item.product_name}`));
    if (item.options_display) {
      itemsDiv.appendChild(h('div',{className:'order-item-opts'},item.options_display));
    }
    if (item.other_text) {
      itemsDiv.appendChild(h('div',{className:'order-item-opts'},`"${item.other_text}"`));
    }
  }
  card.appendChild(itemsDiv);

  card.appendChild(h('div',{className:'order-total'},fmtMoney(order.total_cents)));

  if (order.coupon_used) {
    const cat = S.categories.find(c=>c.id===order.coupon_used);
    card.appendChild(h('div',{className:'order-coupon'},`🎁 Coupon: ${cat?.name||order.coupon_used}`));
  }

  if (order.comment) {
    card.appendChild(h('div',{className:'order-comment'},`💬 ${order.comment}`));
  }

  // Actions
  const actions = h('div',{className:'order-actions'});
  if (!isDone) {
    actions.appendChild(h('button',{className:'btn btn-good btn-sm',onClick:()=>dbUpdateOrderStatus(order.id,'COMPLÉTÉE')},'✓ Compléter'));
  } else {
    actions.appendChild(h('button',{className:'btn btn-ghost btn-sm',onClick:()=>dbUpdateOrderStatus(order.id,'NOUVELLE')},'↩ Remettre'));
  }
  card.appendChild(actions);
  return card;
}

// ===== CSV EXPORT =====
function exportCSV() {
  let orders = [...S.orders];
  if (S.staffDateFilter) {
    orders = orders.filter(o=>{
      const d = new Date(o.created_at_ms).toISOString().slice(0,10);
      return d===S.staffDateFilter;
    });
  }
  const rows = [['Date','Heure','Client','Local','Mode','Items','Total','Commentaire']];
  for (const o of orders) {
    const items = (o.items||[]).map(i=>`${i.qty}x${i.product_name}${i.options_display?'('+i.options_display+')':''}`).join(' | ');
    const mode = o.delivery_location==='Passage au café' ? 'Passage' : 'Livraison';
    rows.push([
      fmtDate(o.created_at_ms), fmtTime(o.created_at_ms),
      o.teacher_name, o.delivery_location, mode,
      items, fmtMoney(o.total_cents), o.comment||'',
    ]);
  }
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download = `commandes-${S.staffDateFilter||new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ===== MAIN RENDER =====
function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const route = getRoute();

  root.appendChild(renderTopbar());

  if (route === 'client_login') {
    const c = h('div',{className:'content'}); c.appendChild(renderClientLogin()); root.appendChild(c);
    return;
  }
  if (route === 'client_register') {
    const c = h('div',{className:'content'}); c.appendChild(renderClientRegister()); root.appendChild(c);
    return;
  }
  if (route === 'master') {
    const c = h('div',{className:'content'}); c.appendChild(renderMasterPage()); root.appendChild(c);
    return;
  }

  if (route.startsWith('staff')) {
    // Staff area
    if (!S.staffUser) {
      const c = h('div',{className:'content'}); c.appendChild(renderStaffLogin()); root.appendChild(c);
      return;
    }
    root.appendChild(renderStaffNav());
    if (route==='staff') {
      root.appendChild(renderStaffDashboard());
    } else if (route==='staff_menu') {
      const c = h('div',{className:'content'}); c.appendChild(renderStaffMenuEditor()); root.appendChild(c);
    } else if (route==='staff_hours') {
      const c = h('div',{className:'content'}); c.appendChild(renderStaffHoursEditor()); root.appendChild(c);
    }
    return;
  }

  // Client area
  if (!S.user) {
    const c = h('div',{className:'content'});
    c.appendChild(h('div',{style:{textAlign:'center',padding:'40px 0'}},
      h('div',{style:{fontSize:'3rem',marginBottom:'16px'}},'☕'),
      h('h2',{style:{marginBottom:'10px'}},APP_NAME),
      h('p',{className:'text-muted',style:{marginBottom:'24px'}},'Commandes en ligne — École Régionale de Vent-Nouveau'),
      h('div',{style:{display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap'}},
        h('a',{className:'btn btn-primary',href:'#client_login'},'Se connecter'),
        h('a',{className:'btn btn-secondary',href:'#client_register'},'Créer un compte'),
      ),
      h('p',{style:{marginTop:'32px',fontSize:'.8rem',color:'var(--muted)'}},
        h('a',{href:'#staff'},'Espace staff'),
      ),
    ));
    root.appendChild(c);
    return;
  }

  const c = h('div',{className:'content'});
  if (S.clientView==='order') {
    c.appendChild(renderClientOrderForm());
  } else if (S.clientView==='history') {
    const hist = renderClientHistory();
    if (hist instanceof Promise) {
      c.appendChild(h('div',{style:{textAlign:'center',padding:'24px'}},h('div',{className:'spinner'})));
      hist.then(el=>{ c.innerHTML=''; c.appendChild(el); });
    } else {
      c.appendChild(hist);
    }
  } else if (S.clientView==='favorites') {
    c.appendChild(renderClientFavorites());
  } else if (S.clientView==='account') {
    c.appendChild(renderClientAccount());
  }
  root.appendChild(c);
  root.appendChild(renderClientNav());
}

// ===== BOOT =====
async function boot() {
  loadSession();
  if (S.user) S.deliveryLocation = S.user.location;

  // iOS anti-zoom
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

  // Vanta.js
  try {
    if (typeof VANTA !== 'undefined') {
      VANTA.WAVES({
        el:'#vanta-bg',
        mouseControls:true, touchControls:true, gyroControls:false,
        minHeight:200, minWidth:200, scale:1, scaleMobile:1,
        color:0x0d0a1e, shininess:30, waveHeight:15, waveSpeed:0.5, zoom:0.65,
      });
    }
  } catch(e) {}

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW:',e));
  }

  // Visibility / focus refresh (iOS PWA)
  document.addEventListener('visibilitychange',()=>{
    if (!document.hidden) { dbLoadOrders(); dbLoadMenu(); dbLoadHours(); scheduleRender(); }
  });
  window.addEventListener('focus',()=>{ dbLoadOrders(); scheduleRender(); });

  // Initial render
  scheduleRender();

  // Load data
  try {
    await Promise.all([dbLoadMenu(), dbLoadOrders(), dbLoadHours()]);
    if (S.user) await syncFavs();
    startRealtime();
    scheduleRender();
  } catch(e) {
    console.error('Boot error:', e);
    scheduleRender();
  }
}

boot();
</script>
</body>
</html>
